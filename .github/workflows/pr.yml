name: Pull Request

permissions: write-all

on:
  pull_request:
    branches: [mastur]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: "1.0.0"

  test:
    needs: build
    uses: ./.github/workflows/test.yml

  report:
    needs: test
    uses: ./.github/workflows/report.yml
    with:
      pull_request_number: ${{ github.event.number }}
